name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка веб-версии
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Иконки
        run: python3 tools/make_icon.py

      - name: Зависимости
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Экспорт веб-версии
        working-directory: mobile
        run: npx expo export --platform web

      - name: Данные рядом с приложением
        run: |
          mkdir -p mobile/dist/data
          cp mobile/src/data/bootstrap.json mobile/dist/data/bootstrap.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
